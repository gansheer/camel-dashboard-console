name: release

on:
  pull_request:
    branches:
      - "release-*"
  push:
    branches:
      - "release-*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Yarn
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Build plugin
        run: make build

      - name: Lint plugin
        continue-on-error: true
        run: make lint

      - name: Log in to registry
        if: startsWith(github.ref, 'refs/heads/release-')
        id: login-registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build plugin container
        shell: bash
        run: |
          make CUSTOM_PLUGIN_IMAGE=quay.io/camel-tooling/camel-dashboard-console CUSTOM_PLUGIN_VERSION=${{ steps.version.outputs.VERSION }}-${{ matrix.arch }} image

      - name: Push plugin container
        if: startsWith(github.ref, 'refs/heads/release-')
        shell: bash
        run: |
          make CUSTOM_PLUGIN_IMAGE=quay.io/camel-tooling/camel-dashboard-console CUSTOM_PLUGIN_VERSION=${{ steps.version.outputs.VERSION }}-${{ matrix.arch }} push

  manifest:
    if: startsWith(github.ref, 'refs/heads/release-')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Log in to registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Create and push multi-arch manifests
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IMAGE=quay.io/camel-tooling/camel-dashboard-console

          podman manifest create ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64
          podman manifest push ${IMAGE}:${VERSION} docker://${IMAGE}:${VERSION}

      - name: Generate SBOM
        run: npx @cyclonedx/cdxgen -o sbom.json -t yarn

      - name: Install ORAS
        uses: oras-project/setup-oras@v2

      - name: Attach application SBOM to container image
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          oras attach --distribution-spec v1.1-referrers-api \
            --annotation "org.cyclonedx.sbom.scope=application" \
            quay.io/camel-tooling/camel-dashboard-console:${VERSION} \
            --artifact-type application/vnd.cyclonedx+json \
            sbom.json:application/vnd.cyclonedx+json

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate and attach image SBOM
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          syft quay.io/camel-tooling/camel-dashboard-console:${VERSION} -o cyclonedx-json=image-sbom.json
          oras attach --distribution-spec v1.1-referrers-api \
            --annotation "org.cyclonedx.sbom.scope=container" \
            quay.io/camel-tooling/camel-dashboard-console:${VERSION} \
            --artifact-type application/vnd.cyclonedx+json \
            image-sbom.json:application/vnd.cyclonedx+json
